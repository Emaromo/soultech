<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soul Tech — Aplicaciones a medida para tu negocio</title>
  <meta name="description" content="Soul Tech: desarrollo de aplicaciones a medida, cloud, ciberseguridad, IA y diseño UI/UX. Córdoba, Argentina." />

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM + Babel (para compilar JSX en el navegador) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Framer Motion (animaciones) -->
  <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
  <script>window.Motion = window.FramerMotion;</script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #0a0a0a; color: #fff; overflow-x: hidden; scroll-behavior: smooth; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    img { max-width: 100%; height: auto; }

    /* ===== Fondo futurista base ===== */
    .futuristic-bg {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #0a0a0a 100%);
      min-height: 100vh; position: relative; overflow-x: hidden;
    }
    .matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }

    .glass-panel {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0,255,255,0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transition: all .4s ease;
    }
    .panel-3d { transform-style: preserve-3d; transition: transform .5s ease; }
    .panel-3d:hover { transform: rotateX(3deg) rotateY(-3deg) scale(1.02); }

    .neon-border { position: relative; overflow: hidden; }
    .neon-border::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(197,197,220,0.4), transparent);
      transition: left .5s;
    }
    .neon-border:hover::before { left: 100%; }

    .glow-text { text-shadow: 0 0 5px rgb(255,255,255), 0 0 3px rgb(0,0,0); }

    @keyframes slideInDown { from { opacity:0; transform: translate3d(0,-100%,0);} to {opacity:1; transform:translate3d(0,0,0);} }
    @keyframes slideInUp   { from { opacity:0; transform: translate3d(0,100%,0);} to {opacity:1; transform:translate3d(0,0,0);} }
    @keyframes slideInLeft { from { opacity:0; transform: translate3d(-100%,0,0);} to {opacity:1; transform:translate3d(0,0,0);} }
    @keyframes slideInRight{ from { opacity:0; transform: translate3d(100%,0,0);} to {opacity:1; transform:translate3d(0,0,0);} }
    @keyframes fadeIn { from { opacity:0;} to {opacity:1;} }
    .slide-in-down { animation: slideInDown 1s ease-out; }
    .slide-in-up   { animation: slideInUp 1s ease-out; }
    .slide-in-left { animation: slideInLeft 1s ease-out; }
    .slide-in-right{ animation: slideInRight 1s ease-out; }
    .fade-in       { animation: fadeIn 1s ease-out; }

    @keyframes floating { 0%,100% { transform: translateY(0) rotate(0deg);} 50% { transform: translateY(-20px) rotate(180deg);} }
    .floating-element { animation: floating 6s ease-in-out infinite; }

    /* Formulas flotantes */
    .formula-container { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; }
    .formula { position:absolute; color:#430da7; font-family:'Courier New', monospace; font-size:14px; opacity:.3; animation: floatFormula 15s linear infinite; }
    .formula-1{top:10%;left:10%;animation-delay:0s;} .formula-2{top:20%;right:15%;animation-delay:-3s;}
    .formula-3{top:60%;left:20%;animation-delay:-6s;} .formula-4{top:80%;right:25%;animation-delay:-9s;}
    .formula-5{top:40%;left:70%;animation-delay:-12s;} .formula-6{top:30%;right:40%;animation-delay:-15s;}
    @keyframes floatFormula { 0%{transform:translateY(0) rotate(0deg);opacity:.3;} 50%{transform:translateY(-20px) rotate(2deg);opacity:.6;} 100%{transform:translateY(0) rotate(0deg);opacity:.3;} }

    /* Formas geometricas */
    .geometric-shapes { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
    .shape { position:absolute; border:1px solid rgba(0,191,255,0.2); animation: rotateShape 20s linear infinite; }
    .square-1{width:30px;height:30px;top:15%;left:80%;animation-delay:0s;}
    .square-2{width:25px;height:25px;top:70%;left:10%;animation-delay:-5s;}
    .square-3{width:35px;height:35px;top:45%;right:20%;animation-delay:-10s;}
    .square-4{width:20px;height:20px;top:25%;left:50%;animation-delay:-15s;}
    .square-5{width:40px;height:40px;top:85%;right:60%;animation-delay:-20s;}
    .square-6{width:28px;height:28px;top:55%;left:30%;animation-delay:-25s;}
    .circle-1{width:32px;height:32px;border-radius:50%;top:35%;right:10%;animation-delay:-8s;border-color:rgba(147,51,234,0.3);}
    .circle-2{width:24px;height:24px;border-radius:50%;top:75%;left:60%;animation-delay:-18s;border-color:rgba(147,51,234,0.3);}
    .triangle-1{width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:26px solid rgba(0,191,255,0.2);top:50%;right:5%;animation-delay:-12s;}
    .triangle-2{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:20px solid rgba(147,51,234,0.2);top:20%;left:40%;animation-delay:-22s;}
    @keyframes rotateShape { 0%{transform:rotate(0deg) scale(1);} 50%{transform:rotate(180deg) scale(1.1);} 100%{transform:rotate(360deg) scale(1);} }

    /* Lineas de conexion */
    .connection-lines { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
    .line { position:absolute; background: linear-gradient(90deg, transparent, rgba(0,191,255,0.3), transparent); animation: pulseLine 8s ease-in-out infinite; }
    .line-1{width:200px;height:1px;top:30%;left:20%;animation-delay:0s;}
    .line-2{width:150px;height:1px;top:60%;right:30%;animation-delay:-2s;}
    .line-3{width:1px;height:180px;top:40%;left:70%;animation-delay:-4s;background:linear-gradient(180deg,transparent,rgba(147,51,234,0.3),transparent);}
    .line-4{width:1px;height:120px;top:20%;right:15%;animation-delay:-6s;background:linear-gradient(180deg,transparent,rgba(147,51,234,0.3),transparent);}
    @keyframes pulseLine { 0%,100%{opacity:.2;transform:scale(1);} 50%{opacity:.8;transform:scale(1.05);} }

    /* Particulas flotantes */
    .particles { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
    .particle { position:absolute; width:3px; height:3px; background:#00bfff; border-radius:50%; animation: floatParticle 12s linear infinite; box-shadow:0 0 6px #00bfff; }
    .particle-1{top:10%;left:15%;animation-delay:0s;}
    .particle-2{top:25%;right:20%;animation-delay:-1.5s;background:#9333ea;box-shadow:0 0 6px #9333ea;}
    .particle-3{top:45%;left:60%;animation-delay:-3s;}
    .particle-4{top:65%;right:40%;animation-delay:-4.5s;background:#9333ea;box-shadow:0 0 6px #9333ea;}
    .particle-5{top:80%;left:25%;animation-delay:-6s;}
    .particle-6{top:35%;right:70%;animation-delay:-7.5s;background:#9333ea;box-shadow:0 0 6px #9333ea;}
    .particle-7{top:55%;left:45%;animation-delay:-9s;}
    .particle-8{top:75%;right:55%;animation-delay:-10.5s;background:#9333ea;box-shadow:0 0 6px #9333ea;}
    @keyframes floatParticle { 0%{transform:translateY(0) translateX(0);opacity:.4;} 25%{transform:translateY(-30px) translateX(10px);opacity:1;} 50%{transform:translateY(-15px) translateX(-5px);opacity:.6;} 75%{transform:translateY(-25px) translateX(15px);opacity:.8;} 100%{transform:translateY(0) translateX(0);opacity:.4;} }

    /* Cubo 3D central */
    .single-cube-container { perspective:1000px; display:flex; justify-content:center; align-items:center; height:100vh; position:absolute; top:0; left:0; width:100%; pointer-events:none; }
    .main-cube { position:relative; width:400px; height:400px; transform-style:preserve-3d; animation: rotateSingleCube 20s linear infinite; }
    .face { position:absolute; width:400px; height:400px; border:2px solid rgba(0,191,255,0.3); background:rgba(0,191,255,0.05); backdrop-filter: blur(6px); box-shadow:0 0 20px rgba(0,191,255,0.2); }
    .front{transform:translateZ(200px);} .back{transform:rotateY(180deg) translateZ(200px);background:rgba(147,51,234,0.05);border-color:rgba(147,51,234,0.3);}
    .right{transform:rotateY(90deg) translateZ(200px);background:rgba(255,255,0,0.05);border-color:rgba(255,255,0,0.3);}
    .left{transform:rotateY(-90deg) translateZ(200px);background:rgba(0,255,255,0.05);border-color:rgba(0,255,255,0.3);}
    .top{transform:rotateX(90deg) translateZ(200px);background:rgba(0,255,128,0.05);border-color:rgba(0,255,128,0.3);}
    .bottom{transform:rotateX(-90deg) translateZ(200px);background:rgba(255,0,128,0.05);border-color:rgba(255,0,128,0.3);}
    @keyframes rotateSingleCube { 0%{transform:rotateX(0) rotateY(0);} 100%{transform:rotateX(360deg) rotateY(360deg);} }
    @media (max-width: 768px) {
      .main-cube, .face { width:150px; height:150px; }
      .front{transform:translateZ(75px);} .back{transform:rotateY(180deg) translateZ(75px);}
      .right{transform:rotateY(90deg) translateZ(75px);} .left{transform:rotateY(-90deg) translateZ(75px);}
      .top{transform:rotateX(90deg) translateZ(75px);} .bottom{transform:rotateX(-90deg) translateZ(75px);}
      .formula{font-size:12px;} .shape{transform:scale(.8);} .line{transform:scale(.7);} .particle{width:2px;height:2px;}
    }

    @keyframes neonPulse { 0%,100%{opacity:.6;filter:drop-shadow(0 0 6px #0ff);} 50%{opacity:1;filter:drop-shadow(0 0 14px #00ffff);} }
    .animate-neon-line { animation: neonPulse 2.5s ease-in-out infinite; }

    @keyframes borderFlow { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
    .animate-borderFlow { background-size:200% 200%; animation: borderFlow 4s linear infinite; }

    @keyframes energyFlow { 0%{transform:translateX(-100%);opacity:.6;} 50%{opacity:1;} 100%{transform:translateX(100%);opacity:.6;} }
    @keyframes colorShift { 0%{filter:hue-rotate(0deg);} 25%{filter:hue-rotate(90deg);} 50%{filter:hue-rotate(180deg);} 75%{filter:hue-rotate(270deg);} 100%{filter:hue-rotate(360deg);} }
    .animate-energyFlow { animation: energyFlow 5s linear infinite, colorShift 8s linear infinite; }

    @keyframes shine { 0%{transform:translateX(0);opacity:0;} 50%{opacity:.5;} 100%{transform:translateX(200%);opacity:0;} }
    .group:hover .group-hover\:animate-shine { animation: shine 2.5s linear infinite; }

    /* Footer */
    footer { background: linear-gradient(135deg, #000814 0%, #001d3d 50%, #000814 100%); }
    .footer-particles { position:absolute; inset:0; overflow:hidden; }
    .footer-particle { position:absolute; bottom:0; width:4px; height:4px; background:rgba(0,255,255,0.4); border-radius:50%; animation: rise 8s linear infinite; }
    @keyframes rise { 0%{transform:translateY(0) scale(1);opacity:.3;} 50%{opacity:.8;} 100%{transform:translateY(-100vh) scale(.5);opacity:0;} }
    @keyframes energyGradient { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
    .animate-energyGradient { background: linear-gradient(90deg,#00ffff,#008cff,#7b2ff7,#00ffff); background-size:300% 100%; animation: energyGradient 6s linear infinite; }
    .newsletter-success.show { opacity: 1 !important; }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(#00c6ff,#7b2ff7); border-radius: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect, useRef } = React;
    const { motion, AnimatePresence, useInView } = window.Motion;

    /* ============================================================
       Iconos SVG (equivalentes locales de lucide-react, sin CDN)
       ============================================================ */
    const Icon = ({ path, className, viewBox = "0 0 24 24", extra }) => (
      <svg className={className} viewBox={viewBox} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        {path}
        {extra}
      </svg>
    );
    const Building2 = (p) => <Icon {...p} path={<>
      <path d="M6 22V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v18Z"></path>
      <path d="M6 12H4a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h2"></path>
      <path d="M18 9h2a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-2"></path>
      <path d="M10 6h4"></path><path d="M10 10h4"></path><path d="M10 14h4"></path><path d="M10 18h4"></path>
    </>} />;
    const UserCog = (p) => <Icon {...p} path={<>
      <circle cx="9" cy="7" r="4"></circle>
      <path d="M5.2 21a7 7 0 0 1 13.6 0"></path>
      <circle cx="19" cy="16" r="2.5"></circle>
      <path d="M19 12.5v.5M19 18.5v.5M22 16h-.5M16.5 16H16"></path>
    </>} />;
    const XIcon = (p) => <Icon {...p} path={<><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></>} />;
    const Mail = (p) => <Icon {...p} path={<>
      <rect width="20" height="16" x="2" y="4" rx="2"></rect>
      <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
    </>} />;
    const User = (p) => <Icon {...p} path={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></>} />;
    const MessageSquare = (p) => <Icon {...p} path={<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>} />;
    const MapPin = (p) => <Icon {...p} path={<><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></>} />;
    const Phone = (p) => <Icon {...p} path={<path d="M13.83 16.57a1 1 0 0 0 1.21-.3l.36-.47A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.75 1.56l-.47.36a1 1 0 0 0-.29 1.22 12 12 0 0 0 6.23 6.23Z"></path>} />;
    const Clock = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></>} />;
    const Facebook = (p) => <Icon {...p} path={<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>} />;
    const Instagram = (p) => <Icon {...p} path={<>
      <rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect>
      <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
      <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
    </>} />;
    const Linkedin = (p) => <Icon {...p} path={<>
      <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
      <rect width="4" height="12" x="2" y="9"></rect><circle cx="4" cy="4" r="2"></circle>
    </>} />;
    const Twitter = (p) => <Icon {...p} path={<path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path>} />;
    const Send = (p) => <Icon {...p} path={<><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></>} />;
    const Lightbulb = (p) => <Icon {...p} path={<>
      <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"></path>
      <path d="M9 18h6"></path><path d="M10 22h4"></path>
    </>} />;
    const FileCode2 = (p) => <Icon {...p} path={<>
      <path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v6"></path>
      <path d="M14 2v4a2 2 0 0 0 2 2h4"></path>
      <path d="m5 12-2 2 2 2"></path><path d="m1 16 2-2-2-2"></path>
    </>} />;
    const Rocket = (p) => <Icon {...p} path={<>
      <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
      <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
      <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path>
      <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path>
    </>} />;
    const Users = (p) => <Icon {...p} path={<>
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle>
      <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
    </>} />;

    /* ============================================================
       MatrixBackground
       ============================================================ */
    const MatrixBackground = () => (
      <div className="matrix-bg">
        <div className="single-cube-container">
          <div className="main-cube">
            <div className="face front"></div><div className="face back"></div>
            <div className="face right"></div><div className="face left"></div>
            <div className="face top"></div><div className="face bottom"></div>
          </div>
        </div>
        <div className="formula-container">
          <div className="formula formula-1">f(x) = ax² + bx + c</div>
          <div className="formula formula-2">∑(x₁ + x₂ + ... + xₙ)</div>
          <div className="formula formula-3">∫ f(x)dx</div>
          <div className="formula formula-4">lim x→∞</div>
          <div className="formula formula-5">√(a² + b²)</div>
          <div className="formula formula-6">e^(iπ) + 1 = 0</div>
        </div>
        <div className="geometric-shapes">
          <div className="shape square-1"></div><div className="shape square-2"></div>
          <div className="shape square-3"></div><div className="shape square-4"></div>
          <div className="shape square-5"></div><div className="shape square-6"></div>
          <div className="shape circle-1"></div><div className="shape circle-2"></div>
          <div className="shape triangle-1"></div><div className="shape triangle-2"></div>
        </div>
        <div className="connection-lines">
          <div className="line line-1"></div><div className="line line-2"></div>
          <div className="line line-3"></div><div className="line line-4"></div>
        </div>
        <div className="particles">
          <div className="particle particle-1"></div><div className="particle particle-2"></div>
          <div className="particle particle-3"></div><div className="particle particle-4"></div>
          <div className="particle particle-5"></div><div className="particle particle-6"></div>
          <div className="particle particle-7"></div><div className="particle particle-8"></div>
        </div>
      </div>
    );

    /* ============================================================
       Header
       ============================================================ */
    const Header = () => {
      const [menuOpen, setMenuOpen] = useState(false);
      const [isMobile, setIsMobile] = useState(false);

      useEffect(() => {
        const checkWidth = () => setIsMobile(window.innerWidth < 768);
        checkWidth();
        window.addEventListener("resize", checkWidth);
        return () => window.removeEventListener("resize", checkWidth);
      }, []);

      return (
        <header className="fixed top-0 left-0 w-full h-20 z-50 backdrop-blur-lg border-b border-green-400/30 shadow-lg bg-black/20">
          <motion.nav
            className="container mx-auto px-4 sm:px-6 h-full flex justify-between items-center relative"
            initial={{ y: -50, opacity: 0 }}
            animate={{ y: 0, opacity: 1 }}
            transition={{ duration: 0.8, ease: "easeOut" }}
          >
            <div className="flex items-center gap-2 sm:gap-3 h-full">
              <motion.img
                src="soultech1.png"
                alt="Soul Tech Logo"
                className="h-14 sm:h-16 w-auto object-contain mix-blend-screen -mb-1"
                style={{ filter: "drop-shadow(0 0 8px #3682a2ff) drop-shadow(0 0 9px #0f5491ff)" }}
                animate={{ scale: [1, 1.03, 1] }}
                transition={{ duration: 3, repeat: Infinity, ease: "easeInOut" }}
              />
              <motion.img
                src="letras.png"
                alt="Soul Tech Texto"
                className="h-8 sm:h-10 md:h-12 w-auto object-contain"
                style={{ marginLeft: "-8px" }}
                initial={{ opacity: 0.9 }}
                animate={{ opacity: [0.9, 1, 0.9] }}
                transition={{ duration: 3, repeat: Infinity, ease: "easeInOut" }}
              />
            </div>

            <div className="hidden md:flex space-x-6 lg:space-x-8 text-base lg:text-lg">
              {["Servicios", "Precios", "Clientes", "Contacto"].map((item) => (
                <motion.a
                  key={item}
                  href={`#${item.toLowerCase()}`}
                  className="text-gray-300 hover:text-blue-400 transition-all duration-300"
                  whileHover={{ scale: 1.1 }}
                >
                  {item}
                </motion.a>
              ))}
            </div>

            <a
              href="https://wa.me/5493516325887"
